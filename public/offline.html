<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123570" />
    <title>FleetSite | Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        background: #ffffff;
        color: #0f172a;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
      }
      .logo {
        width: 88px;
        height: 88px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
        color: #123570;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #64748b;
        max-width: 360px;
        margin: 0 0 24px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #fee2e2;
        color: #b91c1c;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: 999px;
        margin-bottom: 16px;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: #b91c1c;
        border-radius: 999px;
      }
      button {
        appearance: none;
        border: 0;
        background: #123570;
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 22px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(18, 53, 112, 0.25);
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/Fleetsite.svg" alt="FleetSite" />
      <span class="pill"><span class="dot"></span> Offline</span>
      <h1>You're offline</h1>
      <p>
        FleetSite couldn't reach the server. Check your connection and try
        again. Pages you've already opened may still work.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
